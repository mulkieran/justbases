---
name: justbases CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  development_environment_checks:
    strategy:
      matrix:
        include:
          - dependencies: ruff
            task: make -f Makefile fmt-travis
          - dependencies: libatomic python3-hypothesis python3-setuptools ruff
            task: PATH=${PATH}:/github/home/.local/bin make -f Makefile lint
          - dependencies: python3-hypothesis python3-setuptools
            task: PYTHONPATH=./src make -f Makefile test
          - dependencies: python3-coverage python3-hypothesis python3-setuptools
            task: PYTHONPATH=./src make -f Makefile coverage
          - dependencies: python python3-build twine
            task: make -f Makefile package
    runs-on: ubuntu-latest
    container: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: >
          dnf install -y
          make
          pip
          ${{ matrix.dependencies }}
      - name: Install pyright
        run: pip install --user pyright
      - name: Run ${{ matrix.task }}
        run: ${{ matrix.task }}

  lowest_supported_python:
    strategy:
      matrix:
        include:
          - dependencies: python3-hypothesis
            task: PYTHONPATH=./src make -f Makefile test
    runs-on: ubuntu-latest
    container: fedora:44  # CURRENT DEVELOPMENT ENVIRONMENT
    steps:
      - name: Install python3.12
        run: >
          dnf install -y
          alternatives
          python3.12
      - name: Set python3 to python3.12
        run: >
          alternatives
          --install /usr/bin/python3
          python3
          /usr/bin/python3.12
          10
      - name: Display Python version
        run: python3 --version
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: >
          dnf install -y
          make
          ${{ matrix.dependencies }}
      - name: Run ${{ matrix.task }}
        run: ${{ matrix.task }}

  general_checks:
    uses: stratis-storage/github-actions/.github/workflows/reusable_general.yml@master
    with:
      fedora-container-image-number: 44  # CURRENT DEVELOPMENT ENVIRONMENT
